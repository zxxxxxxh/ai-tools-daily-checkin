<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 签到管理台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>AI 签到管理台</h1>
    <div class="header-actions">
      <span id="run-state" class="run-state idle">空闲</span>
      <button id="btn-run-all" class="primary">全部签到</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左侧：概览 + 渠道卡片（点击下钻） -->
    <section class="col-left">
      <section class="panel overview">
        <div class="overview-item">
          <div class="overview-label">全部渠道合计</div>
          <div class="overview-value" id="credits-total">—</div>
          <div class="overview-sub" id="credits-at">加载中…</div>
        </div>
        <div class="overview-item">
          <div class="overview-label">上次运行</div>
          <div class="overview-value" id="last-run-summary">暂无记录</div>
          <div class="overview-sub" id="last-run-at"></div>
        </div>
        <div class="overview-actions">
          <button id="btn-credits-refresh" class="small">刷新积分</button>
        </div>
      </section>

      <div id="view-root"></div>
    </section>

    <!-- 右侧：运行日志 -->
    <aside class="col-right">
      <section class="panel log-panel">
        <div class="panel-head">
          <h2>运行日志</h2>
          <label class="auto-refresh">
            <input type="checkbox" id="log-auto" checked /> 运行中自动刷新
          </label>
          <button id="btn-log-refresh">刷新</button>
        </div>
        <pre id="log-view" class="log-view"></pre>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
